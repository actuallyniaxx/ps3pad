name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64        # Raspberry Pi 4/5 con SO de 64 bits
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make
      - run: ./ps3pad --help
      - run: tar czf ps3pad-linux-${{ matrix.arch }}.tar.gz ps3pad README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ps3pad-linux-${{ matrix.arch }}
          path: ps3pad-linux-${{ matrix.arch }}.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
      # Static: a single .exe, no SDL2.dll next to it
      - run: make STATIC=1
      - run: ./ps3pad.exe --help
      - run: |
          mkdir dist && cp ps3pad.exe README.md dist/
          cd dist && zip -r ../ps3pad-windows-x64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ps3pad-windows-x64
          path: ps3pad-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 pkg-config
      - run: make
      - run: ./ps3pad --help
      - run: tar czf ps3pad-macos-arm64.tar.gz ps3pad README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ps3pad-macos-arm64
          path: ps3pad-macos-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
